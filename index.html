<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mini YouTube con Bootstrap</title>

    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- CSS propio -->
    <link rel="stylesheet" href="css/style.css">
</head>
<body>

    <!-- Barra superior estilo YouTube -->
    <nav class="navbar navbar-dark px-4">
        <div class="container-fluid">
            <span class="logo"><img src="img/logo.png" alt=""></span>

            <form class="d-flex w-50">
                <input 
                    class="form-control me-2 bg-dark text-white border-secondary" 
                    type="search" 
                    placeholder="Buscar"
                >
                <button class="btn btn-outline-light" type="button">
                    Buscar
                </button>
            </form>
        </div>
    </nav>

    <div class="container mt-4">

        <!-- Reproductor principal -->
        <div class="row justify-content-center">
                  <div class="col-lg-3"></div>
            <div class="col-lg-6">

                <div class="video-container">
                    <video 
                        id="videoPlayer" 
                        class="w-100" 
                        controls 
                        autoplay
                        poster="img/miniatura1.png"
                    >
                        <source id="videoSource" src="video/video1.mp4" type="video/mp4">
                        Tu navegador no soporta videos HTML5.
                    </video>
                </div>

                <h3 id="videoTitle" class="video-title">
                    Video principal
                </h3>

                <p id="videoDescription" class="video-description">
                    Haz clic en una miniatura para cambiar el video.
                </p>
    
            </div>
               <div class="col-lg-3"></div>
        </div>

        <!-- Miniaturas de videos -->
        <div class="row mt-4 g-4">

            <!-- Video 1 -->
            <div class="col-md-3 col-sm-6">
                <div 
                    class="card thumbnail-card active"
                    data-video="video/video1.mp4"
                    data-poster="img/miniatura1.png"
                    data-title="ejemplo"
                    data-description="Este es el primer video seleccionado."
                >
                    <img 
                        src="img/miniatura1.png" 
                        class="card-img-top" 
                        alt="Video 1"
                    >
                    <div class="card-body">
                        <h6 class="card-title text-white">Video 1</h6>
                        <p class="card-text text-secondary">Primer video</p>
                    </div>
                </div>
            </div>

            <!-- Video 2 -->
            <div class="col-md-3 col-sm-6">
                <div 
                    class="card thumbnail-card"
                    data-video="video/video2.mp4"
                    data-poster="img/miniatura2.png"
                    data-title="Segundo video"
                    data-description="Este es el segundo video cargado al hacer clic."
                >
                    <img 
                        src="img/miniatura2.png" 
                        class="card-img-top" 
                        alt="Video 2"
                    >
                    <div class="card-body">
                        <h6 class="card-title text-white">Video 2</h6>
                        <p class="card-text text-secondary">Segundo video</p>
                    </div>
                </div>
            </div>

            <!-- Video 3 -->
            <div class="col-md-3 col-sm-6">
                <div 
                    class="card thumbnail-card"
                    data-video="video/video3.mp4"
                    data-poster="img/miniatura3.png"
                    data-title="Tercer video"
                    data-description="Este es el tercer video seleccionado."
                >
                    <img 
                        src="img/miniatura3.png" 
                        class="card-img-top" 
                        alt="Video 3"
                    >
                    <div class="card-body">
                        <h6 class="card-title text-white">Video 3</h6>
                        <p class="card-text text-secondary">Tercer video</p>
                    </div>
                </div>
            </div>

            <!-- Video 4 -->
            <div class="col-md-3 col-sm-6">
                <div 
                    class="card thumbnail-card"
                    data-video="video/video4.mp4"
                    data-poster="img/miniatura4.png"
                    data-title="Cuarto video"
                    data-description="Este es el cuarto video cargado desde la miniatura."
                >
                    <img 
                        src="img/miniatura4.png" 
                        class="card-img-top" 
                        alt="Video 4"
                    >
                    <div class="card-body">
                        <h6 class="card-title text-white">Video 4</h6>
                        <p class="card-text text-secondary">Cuarto video</p>
                    </div>
                </div>
            </div>

        </div>
    </div>

    <!-- Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

    <!-- JS propio -->
    <script src="js/main.js"></script>
</body>
</html>
